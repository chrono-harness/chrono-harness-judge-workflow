[package]
name = "chrono-judge-workflow"
version = "0.1.7"
edition = "2024"
publish = false

[lib]
test = false
doctest = false

[[bin]]
name = "chrono-judge-workflow"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
digest-io = "0.1"
libc = "0.2"
vstd = "=0.0.0-2026-04-20-1748"
sha2 = "0.11"
serde_jcs = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

# Evidence replay hashes both live and retained judge streams.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
